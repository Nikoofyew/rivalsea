<noscript><h1>RivalSea</h1><p>Jeu de bateaux multijoueur gratuit en ligne. Activez JavaScript pour jouer.</p></noscript>

<script>
'use strict';
const {TAU,EVO,CREAM,NAVY,WOOD,HULLS,SAILS,FLAGS,TEAMS,SK,CL,LT,BON,cl,angD}=S;
const I=I18N,tr=(k,p)=>I.t(k,p);
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov'),offerEl=document.getElementById('offer');
let W,H,dpr,lowQ=false,ftE=16;
function rs(){dpr=lowQ?1:Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',rs);rs();
let cfg={name:'',hull:'#ff6b57',sail:'#fff8e7',flag:'skull'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('flottille-cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('flottille-cfg',JSON.stringify(cfg))}catch(e){}};

// ——— État reçu du serveur ———
let ws=null,conn='wait',world=null,WSZ=6800,mode='ffa',myId=0,state='menu',snap=null,me=null,nSnap=0,fullMsg='';
const ents=new Map(); // positions affichées, lissées entre deux messages du serveur
let shotsL=[],parts=[],rings=[],txts=[],hits=[],hitBy=null,banner=null,cam={x:1700,y:1700},T=0,last=0,mx=0,my=0,joy=null,touchMode=false,SKB={x:0,y:0,r:0},offerKey=null,curOffer=null;

function connect(){
const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
try{ws=new WebSocket(url)}catch(e){conn='err';updStatus();setTimeout(connect,3000);return}
conn='wait';updStatus();
ws.onopen=()=>{conn='ok';updStatus()};
ws.onclose=()=>{conn='err';world=null;if(state!=='menu'){state='menu';menu(tr('lost'))}else updStatus();setTimeout(connect,2000)};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onMsg(m)}}
const sendM=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))};
function onMsg(m){
if(m.t==='w'){world={rocks:m.rocks.map(([x,y,r,i,ph])=>({x,y,r,k:i?'ile':'recif',ph})),fogs:m.fogs.map(([x,y,r,z,ph])=>({x,y,r,z,ph}))};WSZ=m.ws;mode=m.mode;updStatus()}
else if(m.t==='joined'){myId=m.id;state='play';ov.hidden=true;offerKey=null;fullMsg=''}
else if(m.t==='full'){fullMsg='full';updStatus()}
else if(m.t==='dead'){state='dead';offerEl.hidden=true;offerKey=null;showDead(m)}
else if(m.t==='st')applySnap(m)}
let lastIn=null;const LAT=.09;
function applySnap(m){snap=m;nSnap++;const ids=new Set();
const put=(o,isLoot)=>{ids.add(o.i);let d=ents.get(o.i);if(!d||Math.hypot(d.x-o.x,d.y-o.y)>500){d={x:o.x,y:o.y,a:o.a,pa:o.a,m:o.m||o.a,ox:0,oy:0,born:nSnap>2?T:-9};ents.set(o.i,d)}
// lissage : on garde l'écart entre ce qui est affiché et la nouvelle position, puis on le fait fondre en douceur
if(d.tx!==undefined&&o.i!==myId){const ag=Math.min(T-d.st,.45);d.ox=d.x-o.x;d.oy=d.y-o.y;if(Math.hypot(d.ox,d.oy)>300){d.ox=d.oy=0}}
d.tx=o.x;d.ty=o.y;d.vx=o.vx||0;d.vy=o.vy||0;d.st=T;d.ta=o.a;d.tm=o.m||o.a};
for(const b of m.b)put(b);for(const l of m.l)put(l,1);
for(const id of [...ents.keys()])if(!ids.has(id))ents.delete(id);
shotsL=m.s.map(s=>({x:s[0],y:s[1],vx:s[2],vy:s[3],sz:s[4],col:s[5],spl:s[6],l:s[7],L:s[8],k:s[9]||'ball'}));
for(const f of m.fx){if(f.k==='burst')burst(f.x,f.y,f.col,f.n,f.sp);else if(f.k==='ring')rings.push({x:f.x,y:f.y,r:f.r,m:f.m,l:f.l,L:f.l,col:f.col});else if(f.k==='txt')txts.push({x:f.x,y:f.y,s:fxText(f),col:f.col,l:f.l,L:f.l});else if(f.k==='banner')banner={s:evText(f),l:4.5};else if(f.k==='hit'){hits.push({a:f.a,l:.9});hitBy={n:f.n||tr('theKraken'),l:2.5}}}
me=m.me;if(state==='play')renderOffer(me&&me.of)}
function fxText(f){const p=Object.assign({},f.p);if(f.id==='evo')p.c=I.cls(p.c).n;if(f.id==='skill')p.s=I.sk(p.s).n;return tr('fx.'+f.id,p)}
function evText(f){const p=Object.assign({},f.p);if('n' in p&&!p.n)p.n=tr('someone');return tr('ev.'+f.id,p)}
function burst(x,y,col,n,sp){if(parts.length>(lowQ?200:500))return;for(let i=0;i<n;i++){const a=Math.random()*TAU,v=40+Math.random()*((sp||200)-40);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4+Math.random()*.5,col,r:2+Math.random()*3})}}

// ——— Commandes ———
const onSkillBtn=e=>Math.hypot(e.clientX-SKB.x,e.clientY-SKB.y)<SKB.r+8;
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;
if(onSkillBtn(e)){sendM({t:'sk'});return}
if(e.pointerType==='touch'){touchMode=true;joy={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY}}else{mx=e.clientX;my=e.clientY}});
addEventListener('pointermove',e=>{if(joy&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY}else if(e.pointerType!=='touch'){touchMode=false;mx=e.clientX;my=e.clientY}});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
addEventListener('keydown',e=>{if(state!=='play'||e.target.tagName==='INPUT')return;
if(e.code==='Space'){e.preventDefault();sendM({t:'sk'})}
let n=['Digit1','Digit2','Digit3'].indexOf(e.code);if(n<0)n=['Numpad1','Numpad2','Numpad3'].indexOf(e.code);if(n<0)n=['1','2','3'].indexOf(e.key);if(n>=0&&curOffer&&!offerEl.hidden&&n<curOffer.o.length)pickOffer(n)});
const zoom=()=>me?cl(1.12/(.7+.3*CL[me.c].sz)-me.l*.006,.45,1.1):.8;
// envoi de la direction au serveur 20 fois par seconde
setInterval(()=>{const z=zoom(),view={vw:Math.round(W/2/z),vh:Math.round(H/2/z)};
if(state!=='play'||!me){sendM(Object.assign({t:'in'},view));return}
const d=ents.get(myId);if(!d)return;let a=d.a,f=.12;
if(joy){const dx=joy.x-joy.x0,dy=joy.y-joy.y0,l=Math.hypot(dx,dy);if(l>8){a=Math.atan2(dy,dx);f=cl(l/60,.25,1)}}
else if(!touchMode){const sx=W/2+(d.x-cam.x)*z,sy=H/2+(d.y-cam.y)*z,dx=mx-sx,dy=my-sy;a=Math.atan2(dy,dx);f=cl(Math.hypot(dx,dy)/(100*z),.2,1)}
lastIn={a,f};sendM(Object.assign({t:'in',a:Math.round(a*1000)/1000,f:Math.round(f*100)/100},view))},33);

// ——— Choix de bonus et d'évolution (sans pause : on choisit en naviguant) ———
function stat(c){const w=c.w;let s=tr('hp')+' ×'+I.num(c.hp)+' · '+tr('speed')+' ×'+I.num(c.spd);if(w.tg>1)s+=' · '+tr('targets',{n:w.tg});if(w.spl)s+=' · '+tr('explosion');if(w.bs)s+=' · '+tr('side');if(c.reg)s+=' · '+tr('regen');if(c.ram)s+=' · '+tr('ramS',{n:I.num(c.ram)});if(c.brd)s+=' · '+tr('brdS');if(c.arm)s+=' · '+tr('armor',{n:Math.round(c.arm*100)});if(c.t<3)s+=' · '+tr('hides');return s+' · '+I.sk(c.sk).n}
function fitT(s,w){if(g.measureText(s).width<=w)return s;while(s.length>1&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function pickOffer(i){if(!curOffer)return;sendM({t:'pick',o:curOffer.id,i});offerEl.hidden=true}
function renderOffer(of){const key=of?of.id:null;if(key===offerKey)return;offerKey=key;curOffer=of;if(!of){offerEl.hidden=true;return}
if(of.k==='evo'){offerEl.innerHTML='<h3>'+tr('evoTitle',{l:of.l})+'</h3><div class="opts">'+of.o.map((k,i)=>{const c=CL[k],x=I.cls(k);return '<button data-i="'+i+'"><canvas width="240" height="152"></canvas>'+x.n+(c.leg?' <span class="leg">'+tr('legendary')+'</span>':'')+'<small class="ds">'+x.w+' · '+x.d+'</small><small class="k st">'+stat(c)+' · '+tr('key',{n:i+1})+'</small></button>'}).join('')+'</div>';
offerEl.querySelectorAll('button').forEach(bt=>{const c=CL[of.o[+bt.dataset.i]],x=bt.querySelector('canvas').getContext('2d');x.scale(2,2);x.translate(60,38);x.rotate(-.35);const b=snap&&snap.b.find(o=>o.i===myId);ship(x,c,Math.min(19,42/c.L),b?b.col:cfg.hull,.35,0,{sail:cfg.sail,flag:cfg.flag})})}
else offerEl.innerHTML='<h3>'+tr('bonusTitle',{l:of.l})+'</h3><div class="opts">'+of.o.map((k,i)=>'<button data-i="'+i+'">'+I.bon(k).n+'<small>'+I.bon(k).d+'</small><small class="k">'+tr('key',{n:i+1})+'</small></button>').join('')+'</div>';
offerEl.querySelectorAll('button').forEach(bt=>bt.onclick=()=>pickOffer(+bt.dataset.i));offerEl.hidden=false}

// ——— Menu et écran de naufrage ———
function statusHTML(){if(fullMsg)return '<span class="status err">'+tr('full')+'</span>';
if(conn==='ok'&&world)return '<span class="status ok">'+tr('connected',{m:tr(mode==='team'?'modeTeam':'modeFfa')})+'</span>';
if(conn==='err')return '<span class="status err">'+tr('unreachable')+'</span>';
return '<span class="status wait">'+tr('connecting')+'</span>'}
function updStatus(){const s=document.getElementById('stat');if(s){s.innerHTML=statusHTML();if(lastBuild&&!ov.hidden)sameH(lastBuild)}const go=document.getElementById('go');if(go)go.disabled=!(conn==='ok'&&world)}
function join(){sendM({t:'join',name:cfg.name||tr('namePh'),hull:cfg.hull,sail:cfg.sail,flag:cfg.flag})}
function prev(){const c=document.getElementById('pv');if(!c)return;const x=c.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,170,106);x.translate(85,55);x.rotate(-.3);ship(x,CL.drakkar,24,mode==='team'?'#8a9bb0':cfg.hull,0,T,{sail:cfg.sail,flag:cfg.flag})}
let lastMenuMsg='';
const FLAGSVG={fr:'<svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg>',
en:'<svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>',
es:'<svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg>'};

function hullPath(x,L,Wd,hs){x.beginPath();

else if(hs==='round'){x.moveTo(L*.95,0);x.bezierCurveTo(L*.8,-Wd*1.15,-L*.5,-Wd*1.2,-L*.72,-Wd*.75);x.lineTo(-L*.72,Wd*.75);x.bezierCurveTo(-L*.5,Wd*1.2,L*.8,Wd*1.15,L*.95,0)}
else if(hs==='sleek'){x.moveTo(L*1.05,0);x.quadraticCurveTo(L*.4,-Wd*1.15,-L*.5,-Wd*.9);x.lineTo(-L*.7,-Wd*.6);x.lineTo(-L*.7,Wd*.6);x.lineTo(-L*.5,Wd*.9);x.quadraticCurveTo(L*.4,Wd*1.15,L*1.05,0)}
else if(hs==='fort'){const rx=L*.9,ry=Wd*1.1;x.moveTo(rx,0);x.lineTo(rx*.5,-ry);x.lineTo(-rx*.5,-ry);x.lineTo(-rx,0);x.lineTo(-rx*.5,ry);x.lineTo(rx*.5,ry)}
else if(hs==='ironram'){x.moveTo(L*.82,0);x.quadraticCurveTo(L*.72,-Wd,L*.2,-Wd);x.lineTo(-L*.5,-Wd);x.quadraticCurveTo(-L*.82,-Wd*.95,-L*.82,-Wd*.4);x.lineTo(-L*.82,Wd*.4);x.quadraticCurveTo(-L*.82,Wd*.95,-L*.5,Wd);x.lineTo(L*.2,Wd);x.quadraticCurveTo(L*.72,Wd,L*.82,0)}
else if(hs==='cruiser'){x.moveTo(L*1.05,0);x.quadraticCurveTo(L*.6,-Wd,L*.1,-Wd);x.lineTo(-L*.55,-Wd);x.bezierCurveTo(-L*.8,-Wd,-L*.95,-Wd*.5,-L*.95,0);x.bezierCurveTo(-L*.95,Wd*.5,-L*.8,Wd,-L*.55,Wd);x.lineTo(L*.1,Wd);x.quadraticCurveTo(L*.6,Wd,L*1.05,0)}
else if(hs==='steel'){x.moveTo(L,0);x.quadraticCurveTo(L*.55,-Wd*1.05,L*.1,-Wd);x.lineTo(-L*.66,-Wd*.95);x.quadraticCurveTo(-L*.78,-Wd*.9,-L*.78,-Wd*.5);x.lineTo(-L*.78,Wd*.5);x.quadraticCurveTo(-L*.78,Wd*.9,-L*.66,Wd*.95);x.lineTo(L*.1,Wd);x.quadraticCurveTo(L*.55,Wd*1.05,L,0)}
else{x.moveTo(L,0);x.quadraticCurveTo(L*.45,-Wd*1.2,-L*.6,-Wd);x.lineTo(-L*.72,-Wd*.7);x.lineTo(-L*.72,Wd*.7);x.lineTo(-L*.6,Wd);x.quadraticCurveTo(L*.45,Wd*1.2,L,0)}
x.closePath()}
